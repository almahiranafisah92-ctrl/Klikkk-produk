const filteredProducts = products.filter(p => {

const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase());
return matchesCat && matchesSearch;
});

value={searchQuery}
onChange={(e) => setSearchQuery(e.target.value)}
placeholder="Cari berkas digital..."
className="w-full bg-slate-900/90 text-white pl-10 pr-4 py-2 rounded-xl border border-white/20 text-xs focus:outline-none"
/>
</div>
</section>

{/* Content Body */}
<main className="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">

{/* Navigasi Kategori */}
<div className="flex gap-2 overflow-x-auto pb-4 mb-6">
{categories.map((cat, i) => (
<button
key={i}
onClick={() => setActiveCategory(cat)}
className={px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition${
activeCategory === cat ? ${theme.primary} shadow-md: "bg-white text-slate-700 hover:bg-slate-100 border border-slate-200" }}
{cat}
</button>
))}
</div>

{/* Grid Berkas Minimalis */}
<h3 className="text-sm font-black text-slate-900 mb-4 tracking-wider uppercase border-b pb-2">
{activeCategory} ({filteredProducts.length})
</h3>

<div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
{filteredProducts.map(p => (
<div key={p.id} className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex flex-col items-center text-center justify-between relative group">

{/* Icon Frame Bulat Ringkas */}
<div className="w-20 h-20 rounded-full border-2 border-slate-900 flex flex-col items-center justify-center p-2 mb-3 bg-slate-50">
<Icon name={p.iconType || "book"} className="w-8 h-8 text-slate-800" />
<span className="text-[9px] font-black uppercase text-slate-900 truncate max-w-[60px]">
{p.iconText || "FILE"}
</span>
</div>

<h4 className="text-xs font-bold text-slate-900 line-clamp-2 leading-tight mb-3 h-8 flex items-center">
{p.title}
</h4>

<a
href={p.fileUrl || "#"}
target="_blank"
rel="noopener noreferrer"
className={w-full font-bold py-1.5 px-2 rounded-xl text-[11px] flex items-center justify-center gap-1${theme.primary}`}
<span>{p.buttonLabel || "Unduh"}</span>
<Icon name="external" className="w-3 h-3" />
</a>

</div>
))}
</div>

</main>

</div>
);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
